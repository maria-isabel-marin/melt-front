<h2 mat-dialog-title>New Corpus</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name *</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Climate Change Discourse">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"
        placeholder="Brief description of the corpus"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Discursive Community</mat-label>
      <input matInput formControlName="discursiveCommunity" placeholder="e.g. Politicians, Journalists">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Textual Genre</mat-label>
      <input matInput formControlName="textualGenre" placeholder="e.g. Speech, Editorial">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || saving">
    @if (saving) { <mat-spinner diameter="16" strokeWidth="2"></mat-spinner> }
    Create
  </button>
</mat-dialog-actions>
