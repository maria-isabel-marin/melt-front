<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">M</div>
      <h1>MELT</h1>
      <p class="subtitle">Metaphor Extraction &amp; Language Toolkit</p>
    </div>

    <div class="divider"></div>

    <div class="description">
      <p>Analyze and process conceptual metaphors using AI-assisted linguistic analysis based on MIPVU, Musolff, and Valdivia frameworks.</p>
    </div>

    <div class="actions">
      <button mat-flat-button color="primary" class="login-btn" (click)="loginWithGoogle()">
        <img src="assets/google-logo.svg" alt="" width="18" height="18" onerror="this.style.display='none'">
        Sign in with Google
      </button>

      <div class="separator"><span>or</span></div>

      <button mat-stroked-button class="guest-btn" (click)="continueAsGuest()" [disabled]="loading">
        @if (loading) {
          <mat-spinner diameter="18" strokeWidth="2"></mat-spinner>
        } @else {
          <mat-icon>person_outline</mat-icon>
        }
        Continue as Guest
      </button>
    </div>

    <p class="guest-note">
      Guest sessions are temporary. Export your results before closing.
    </p>
  </div>
</div>
