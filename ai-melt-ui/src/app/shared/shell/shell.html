<mat-sidenav-container class="shell-container">
  <!-- Sidebar -->
  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="brand">
      <div class="brand-logo">M</div>
      <span class="brand-name">MELT</span>
    </div>

    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/corpus" routerLinkActive="active">
        <mat-icon matListItemIcon>folder_open</mat-icon>
        <span matListItemTitle>My Corpora</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      @if (isGuest()) {
        <div class="guest-badge">
          <mat-icon>person_outline</mat-icon>
          Guest session
        </div>
      } @else {
        <div class="user-info">
          <mat-icon>account_circle</mat-icon>
          <span class="user-email">{{ user()?.email }}</span>
        </div>
      }
      <button mat-icon-button (click)="logout()" title="Logout" class="logout-btn">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <!-- Main content -->
  <mat-sidenav-content class="shell-content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
